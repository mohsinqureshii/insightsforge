version: '3.9'
services:
  app:
    build: .
    ports: ['3000:3000']
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/insightsforge
      REDIS_URL: redis://redis:6379
    depends_on: [db, redis]
    volumes: ['.:/app', '/app/node_modules', '/app/.next']

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insightsforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: ['postgres_data:/var/lib/postgresql/data']
    ports: ['5432:5432']

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: ['redis_data:/data']

volumes:
  postgres_data:
  redis_data:
